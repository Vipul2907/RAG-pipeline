[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG system with hand-rolled HNSW vector index"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
ui = [
    "streamlit>=1.35.0",
]
huggingface = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
openai = [
    "openai>=1.30.0",
]
anthropic = [
    "anthropic>=0.25.0",
]
groq = [
    "openai>=1.30.0",
]
all = [
    "streamlit>=1.35.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
]

[project.scripts]
rag-cli = "rag.cli:main"
rag-ui = "ui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/rag --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "SIM103"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false